<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Laporan Mesin Brebes</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; --success: #10b981; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px 15px; padding-bottom: 50px; }
        .container { max-width: 500px; margin: 0 auto; }
        .app-header { text-align: center; margin-bottom: 24px; }
        .app-header h2 { font-size: 22px; font-weight: 700; color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .app-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .card { background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); padding: 24px; margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.02); }
        .hidden { display: none !important; }
        #reader { border-radius: 12px; overflow: hidden; border: none !important; }
        #reader__dashboard_section_csr span { font-family: 'Poppins', sans-serif !important; }
        #reader button { background-color: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-family: 'Poppins', sans-serif; cursor: pointer; margin-top: 10px; }
        .manual-input-container { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border-color); }
        .manual-input-label { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; text-align: center; }
        .input-group { display: flex; gap: 10px; }
        .input-group input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; text-transform: uppercase;}
        .input-group input:focus { border-color: var(--primary); }
        .input-group button { background-color: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .input-group button:hover { background-color: var(--primary-hover); }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: var(--bg-color); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .info-box { display: flex; flex-direction: column; }
        .info-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .info-value { font-size: 16px; font-weight: 700; color: var(--primary); }
        h3.section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; border-bottom: 2px solid var(--bg-color); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .timeline { position: relative; padding-left: 20px; }
        .timeline::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--border-color); border-radius: 2px; }
        .timeline-item { position: relative; margin-bottom: 24px; }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-dot { position: absolute; left: -25px; top: 4px; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; border: 3px solid var(--card-bg); box-shadow: 0 0 0 1px var(--primary); }
        .timeline-date { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; display: flex; gap: 12px; }
        .timeline-content { background: var(--bg-color); padding: 12px 16px; border-radius: 0 12px 12px 12px; font-size: 13px; }
        .timeline-content p { margin-bottom: 6px; line-height: 1.5; }
        .timeline-meta { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-color); font-size: 11px; font-weight: 500; color: var(--text-muted); }
        .meta-item i { color: var(--primary); margin-right: 4px; }
        .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 15px; padding: 20px; background: var(--bg-color); border-radius: 8px;}
        .btn-reset { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; margin-top: 25px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .btn-reset:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="container">
        <header class="app-header">
            <h2><i class="fa-solid fa-qrcode"></i> Laporan Mesin</h2>
            <p>Sistem Scanner Maintenance Brebes</p>
        </header>

        <div id="reader-card" class="card">
            <div id="reader" style="width: 100%;"></div>
            <div class="manual-input-container">
                <p class="manual-input-label">Kamera bermasalah? Ketik kode manual:</p>
                <div class="input-group">
                    <input type="text" id="manual-input" placeholder="Contoh: A02" autocomplete="off">
                    <button onclick="cariManual()"><i class="fa-solid fa-magnifying-glass"></i> Cari</button>
                </div>
            </div>
        </div>

        <div id="result-card" class="card hidden">
            <div class="info-grid">
                <div class="info-box">
                    <span class="info-label">Nama Mesin</span>
                    <span class="info-value" id="res-nama">-</span>
                </div>
                <div class="info-box">
                    <span class="info-label">No. Mesin</span>
                    <span class="info-value" id="res-kode">-</span>
                </div>
            </div>
            
            <h3 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Perbaikan</h3>
            
            <div class="timeline" id="res-riwayat"></div>

            <button onclick="resetScanner()" class="btn-reset">
                <i class="fa-solid fa-camera"></i> Cari Mesin Lainnya
            </button>
        </div>
    </div>

    <script>
        const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQHsIF5lFos4c1YZF3dBwT5C61GH3ZYIdwYBte2TY79FQ3GfV7DEA5y3mti_kDPdA/pub?gid=348491996&single=true&output=csv";

        let html5QrcodeScanner = null;
        let dataMesinGlobal = []; 

        function fetchDataFromSheet() {
            Papa.parse(sheetCSVUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    dataMesinGlobal = results.data;
                }
            });
        }

        function onScanSuccess(decodedText) {
            hentikanScanner();
            prosesDataScan(decodedText); 
        }

        function onScanFailure() { }

        function mulaiScanner() {
            document.getElementById('reader-card').classList.remove('hidden');
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('manual-input').value = ''; 
            
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function hentikanScanner() {
            document.getElementById('reader-card').classList.add('hidden');
            try { if(html5QrcodeScanner) html5QrcodeScanner.clear(); } catch (e) {}
        }

        function cariManual() {
            const inputVal = document.getElementById('manual-input').value.trim();
            if (!inputVal) return alert("Silakan masukkan Nomor Mesin terlebih dahulu!");
            hentikanScanner();
            prosesDataScan(inputVal);
        }

        document.getElementById('manual-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') cariManual();
        });

        // FILTER SUPER KETAT
        function prosesDataScan(qrText) {
            const riwayatMesinIni = dataMesinGlobal.filter(row => {
                return row['NO. MESIN'] && row['NO. MESIN'].toUpperCase() === qrText.trim().toUpperCase();
            });

            if (riwayatMesinIni.length > 0) {
                
                const cleanText = (text) => (!text || text.trim() === '') ? '-' : text;

                const validRiwayat = riwayatMesinIni.filter(item => {
                    // Gabungkan semua isi kolom untuk mengecek keberadaan error tersembunyi
                    const semuaTeks = Object.values(item).join(' ').toUpperCase();
                    
                    // Jika ada tulisan N/A, REF!, VALUE! dimana pun di baris itu, buang!
                    if (semuaTeks.includes('#N/A') || semuaTeks.includes('#REF') || semuaTeks.includes('#VAL')) {
                        return false;
                    }

                    // Cek juga apakah kolom Uraian atau Tanggal benar-benar kosong
                    const tgl = item['TANGGAL'] ? item['TANGGAL'].trim() : '';
                    const uraian = item['URAIAN PEKERJAAN'] ? item['URAIAN PEKERJAAN'].trim() : '';
                    
                    if (tgl === '' || uraian === '' || tgl === '-') {
                        return false;
                    }

                    return true;
                });

                document.getElementById('res-nama').innerText = cleanText(riwayatMesinIni[0]['NAMA MESIN']);
                document.getElementById('res-kode').innerText = cleanText(riwayatMesinIni[0]['NO. MESIN']).toUpperCase();

                const riwayatContainer = document.getElementById('res-riwayat');
                riwayatContainer.innerHTML = ''; 
                
                if (validRiwayat.length > 0) {
                    validRiwayat.forEach(item => {
                        riwayatContainer.innerHTML += `
                            <div class="timeline-item">
                                <div class="timeline-dot"></div>
                                <div class="timeline-date">
                                    <span><i class="fa-regular fa-calendar-days"></i> ${cleanText(item['HARI'])}, ${cleanText(item['TANGGAL'])}</span>
                                    <span><i class="fa-regular fa-clock"></i> ${cleanText(item['MULAI'])} - ${cleanText(item['SELESAI'])}</span>
                                </div>
                                <div class="timeline-content">
                                    <p><strong>Kendala:</strong> ${cleanText(item['URAIAN PEKERJAAN'])}</p>
                                    <p><strong>Tindakan:</strong> ${cleanText(item['TINDAKAN PERBAIKAN'])}</p>
                                    <div class="timeline-meta">
                                        <div class="meta-item"><i class="fa-solid fa-user-wrench"></i> ${cleanText(item['TEKNISI'])}</div>
                                        <div class="meta-item"><i class="fa-solid fa-gear"></i> ${cleanText(item['NAMA SPAREPART'])}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    riwayatContainer.innerHTML = '<div class="empty-state"><i class="fa-solid fa-check-circle" style="font-size: 24px; color: var(--success); margin-bottom: 8px; display: block;"></i>Belum ada riwayat perbaikan yang tercatat untuk mesin ini.</div>';
                }

                document.getElementById('result-card').classList.remove('hidden');
            } else {
                alert(`Data tidak ditemukan! Mesin ${qrText.toUpperCase()} belum terdaftar di Laporan Harian.`);
                resetScanner();
            }
        }

        window.onload = () => {
            fetchDataFromSheet();
            mulaiScanner();
        };
    </script>
</body>
</html>
